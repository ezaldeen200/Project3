name: Project3 CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: project3-production
  cancel-in-progress: true

jobs:
  ci-cd:
    name: Build, Scan and Deploy
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify secrets are not committed
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files | grep -E '(^|/)(\.env|.*\.token|.*root\.token)$'; then
            echo "ERROR: Secret-like file is tracked by Git."
            exit 1
          fi

          if git ls-files | grep -E '(^|/)vault/data/'; then
            echo "ERROR: Vault data is tracked by Git."
            exit 1
          fi

          echo "Secret check passed."

      - name: Trivy filesystem scan
        shell: bash
        run: |
          set -euo pipefail
          trivy fs \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            .

      - name: Build application image
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            --pull \
            -t project3-app:${GITHUB_SHA} \
            ./Skills_Utilization./Skills_Utilization

    - name: Scan Docker image
    shell: bash
    run: |
       set -euo pipefail

    trivy image \
      --scanners vuln,secret \
      --severity HIGH,CRITICAL \
      --ignore-unfixed \
      --exit-code 1 \
      --no-progress \
      project3-app:${GITHUB_SHA}

      - name: Start application stack
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "$HOME/Desktop/Project3/Skills_Utilization./Skills_Utilization/.env" ]; then
            echo "ERROR: Required .env file is missing on the runner."
            exit 1
          fi

          docker compose \
            --env-file "$HOME/Desktop/Project3/Skills_Utilization./Skills_Utilization/.env" \
            up -d --build

      - name: Wait for application
        shell: bash
        run: |
          set -euo pipefail

          for i in {1..30}; do
            if curl -fsS http://localhost:5000 > /dev/null; then
              echo "Application is healthy."
              exit 0
            fi

            echo "Waiting for application... ($i/30)"
            sleep 2
          done

          echo "ERROR: Application did not become healthy."
          docker compose \
            --env-file "$HOME/Desktop/Project3/Skills_Utilization./Skills_Utilization/.env" \
            logs --tail 100 app

          exit 1

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000)

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Application returned HTTP $STATUS"
            exit 1
          fi

          echo "Deployment successful. HTTP $STATUS"
