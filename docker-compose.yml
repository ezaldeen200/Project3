services:

  postgres:
    image: postgres:15-alpine
    container_name: project3-postgres
    environment:
      POSTGRES_USER: ${username}
      POSTGRES_PASSWORD: ${password}
      POSTGRES_DB: ${dbname}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${username} -d ${dbname}"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.17
    container_name: project3-vault
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./vault/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./vault/data:/vault/data
    entrypoint: ["sh", "-c"]
    command: ["exec vault server -config=/vault/config/vault.hcl"]

  app:
    image: ${APP_IMAGE}
    container_name: project3-app
    environment:
      DATABASE_URL: postgresql://${username}:${password}@postgres:5432/${dbname}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
